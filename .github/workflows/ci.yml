name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test $(go list ./... | grep -v /internal/integration)

      - name: Integration tests
        run: go test ./internal/integration/... -timeout 300s

      - name: Build Docker image
        run: docker build -t oficina-execution-service:ci .
