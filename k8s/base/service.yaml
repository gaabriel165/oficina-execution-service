apiVersion: v1
kind: Service
metadata:
  name: oficina-execution-service
  labels:
    app: oficina-execution-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: oficina-execution-service
  ports:
    - name: http
      port: 80
      targetPort: http
