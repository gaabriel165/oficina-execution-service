basePath: /api/v1
definitions:
  dto.AddWorkOrderPartRequest:
    properties:
      part_id:
        type: string
      quantity:
        type: integer
    required:
    - part_id
    - quantity
    type: object
  dto.AddWorkOrderServiceRequest:
    properties:
      service_id:
        type: string
    required:
    - service_id
    type: object
  dto.CreatePartRequest:
    properties:
      description:
        type: string
      name:
        type: string
      stock_quantity:
        minimum: 0
        type: integer
      unit_price:
        type: number
    required:
    - name
    - unit_price
    type: object
  dto.CreateServiceRequest:
    properties:
      description:
        type: string
      estimated_minutes:
        type: integer
      labor_price:
        type: number
      name:
        type: string
    required:
    - estimated_minutes
    - labor_price
    - name
    type: object
  dto.ExecutionMetricsResponse:
    properties:
      by_service:
        items:
          $ref: '#/definitions/dto.ServiceMetricResponse'
        type: array
      completed_orders:
        type: integer
      overall_avg_minutes:
        type: number
    type: object
  dto.FailDiagnosisRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  dto.PartResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      stock_quantity:
        type: integer
      unit_price:
        type: number
      updated_at:
        type: string
    type: object
  dto.ServiceMetricResponse:
    properties:
      avg_minutes:
        type: number
      completed_orders:
        type: integer
      service_name:
        type: string
    type: object
  dto.ServiceResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      estimated_minutes:
        type: integer
      id:
        type: string
      labor_price:
        type: number
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdatePartRequest:
    properties:
      description:
        type: string
      name:
        type: string
      unit_price:
        type: number
    required:
    - name
    - unit_price
    type: object
  dto.UpdateServiceRequest:
    properties:
      description:
        type: string
      estimated_minutes:
        type: integer
      labor_price:
        type: number
      name:
        type: string
    required:
    - estimated_minutes
    - labor_price
    - name
    type: object
  dto.UpdateStockRequest:
    properties:
      quantity:
        type: integer
    required:
    - quantity
    type: object
  dto.WorkOrderPartResponse:
    properties:
      name:
        type: string
      part_id:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
    type: object
  dto.WorkOrderResponse:
    properties:
      cancellation_reason:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      execution_started_at:
        type: string
      finished_at:
        type: string
      id:
        type: string
      notes:
        type: string
      order_id:
        type: string
      parts:
        items:
          $ref: '#/definitions/dto.WorkOrderPartResponse'
        type: array
      saga_id:
        type: string
      services:
        items:
          $ref: '#/definitions/dto.WorkOrderServiceResponse'
        type: array
      status:
        type: string
      stock_reserved:
        type: boolean
      updated_at:
        type: string
      vehicle_id:
        type: string
    type: object
  dto.WorkOrderServiceResponse:
    properties:
      labor_price:
        type: number
      name:
        type: string
      service_id:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
host: localhost:8082
info:
  contact: {}
  description: Diagnosis and execution queue, catalog and stock of the mechanical
    workshop.
  title: Tech Challenge — Oficina Mecânica Execution Service
  version: "1.0"
paths:
  /parts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PartResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List all parts
      tags:
      - parts
    post:
      consumes:
      - application/json
      parameters:
      - description: Part data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new part
      tags:
      - parts
  /parts/{id}:
    delete:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a part
      tags:
      - parts
    get:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PartResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a part by ID
      tags:
      - parts
    put:
      consumes:
      - application/json
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      - description: Part data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a part
      tags:
      - parts
  /parts/{id}/stock:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      - description: Stock data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add stock quantity to a part
      tags:
      - parts
  /services:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ServiceResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List all services
      tags:
      - services
    post:
      consumes:
      - application/json
      parameters:
      - description: Service data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateServiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ServiceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new service
      tags:
      - services
  /services/{id}:
    delete:
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a service
      tags:
      - services
    get:
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a service by ID
      tags:
      - services
    put:
      consumes:
      - application/json
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      - description: Service data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a service
      tags:
      - services
  /work-orders:
    get:
      parameters:
      - description: awaiting_diagnosis, in_diagnosis, diagnosed, in_execution, finished
          or cancelled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.WorkOrderResponse'
            type: array
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List work orders, oldest first, optionally filtered by status (the
        diagnosis and execution queues)
      tags:
      - work-orders
  /work-orders/{id}:
    get:
      parameters:
      - description: Service order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WorkOrderResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a work order by the service order ID
      tags:
      - work-orders
  /work-orders/{id}/complete-diagnosis:
    patch:
      parameters:
      - description: Service order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WorkOrderResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete the diagnosis and hand the items over for budgeting
      tags:
      - work-orders
  /work-orders/{id}/fail-diagnosis:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Service order ID
        in: path
        name: id
        required: true
        type: string
      - description: Failure reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.FailDiagnosisRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WorkOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Report that the diagnosis could not be done, cancelling the service
        order
      tags:
      - work-orders
  /work-orders/{id}/finish-execution:
    patch:
      parameters:
      - description: Service order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WorkOrderResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Finish the repair and notify the service order
      tags:
      - work-orders
  /work-orders/{id}/parts:
    post:
      consumes:
      - application/json
      parameters:
      - description: Service order ID
        in: path
        name: id
        required: true
        type: string
      - description: Part and quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddWorkOrderPartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WorkOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a catalog part to the work order during diagnosis
      tags:
      - work-orders
  /work-orders/{id}/services:
    post:
      consumes:
      - application/json
      parameters:
      - description: Service order ID
        in: path
        name: id
        required: true
        type: string
      - description: Service to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddWorkOrderServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WorkOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a catalog service to the work order during diagnosis
      tags:
      - work-orders
  /work-orders/{id}/start-diagnosis:
    patch:
      parameters:
      - description: Service order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WorkOrderResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Take the work order from the diagnosis queue and start the diagnosis
      tags:
      - work-orders
  /work-orders/metrics:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExecutionMetricsResponse'
      security:
      - BearerAuth: []
      summary: Average execution time, overall and per service
      tags:
      - work-orders
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
